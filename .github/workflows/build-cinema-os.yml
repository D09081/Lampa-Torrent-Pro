name: Build Cinema OS IPK

on:
  push:
    branches:
      - cinema-os-webos
    paths:
      - "webos/**"
      - ".github/workflows/build-cinema-os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create app icons
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          for size, name in [(80, "icon.png"), (130, "largeIcon.png")]:
              im = Image.new("RGB", (size, size), "#100b19")
              px = im.load()
              for y in range(size):
                  for x in range(size):
                      t = (x + y) / (2 * size)
                      px[x, y] = (int(35 + 70*t), int(15 + 20*t), int(55 + 130*t))
              draw = ImageDraw.Draw(im)
              margin = int(size * .1)
              draw.rounded_rectangle((margin, margin, size-margin, size-margin), radius=int(size*.2), outline="#c59cff", width=max(2, size//32))
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", int(size*.55))
              except OSError:
                  font = ImageFont.load_default()
              box = draw.textbbox((0, 0), "C", font=font)
              draw.text(((size-(box[2]-box[0]))/2, (size-(box[3]-box[1]))/2-box[1]), "C", font=font, fill="#ffffff")
              im.save("webos/" + name, optimize=True)
          PY

      - name: Validate web app manifest
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("webos")
          app = json.loads((root / "appinfo.json").read_text())
          for key in ("id", "version", "vendor", "type", "main", "title", "icon"):
              assert app.get(key), f"Missing appinfo field: {key}"
          for key in ("main", "icon", "largeIcon"):
              if app.get(key):
                  assert (root / app[key]).is_file(), f"Missing app resource: {app[key]}"
          assert (root / "css/app.css").is_file()
          assert (root / "js/app.js").is_file()
          assert (root / "js/engine.js").is_file()
          print("Manifest and app resources OK:", app["id"], app["version"])
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check webos/js/engine.js
          node --check webos/js/app.js

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli@3.2.6

      - name: Package IPK
        run: |
          mkdir -p dist
          ares-package --no-minify webos --outdir dist
          ls -lh dist
          test -n "$(find dist -maxdepth 1 -name '*.ipk' -print -quit)"

      - name: Inspect IPK
        run: |
          IPK="$(find dist -maxdepth 1 -name '*.ipk' -print -quit)"
          ares-package --info "$IPK"

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinema-os-webos-ipk
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 14
