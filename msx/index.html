<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>Cinema OS</title>
<style>
:root{--bg:#080b14;--panel:#101827;--panel2:#151f31;--line:#26354d;--txt:#f4f7ff;--muted:#91a0b8;--cyan:#56e4ff;--violet:#9a75ff;--focus:#e9faff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif}body{background:radial-gradient(ellipse at 75% 8%,#20214b 0,transparent 42%),radial-gradient(ellipse at 5% 90%,#102d42 0,transparent 40%),var(--bg)}
button,input{font:inherit;color:inherit}button{border:1px solid transparent;background:transparent;cursor:pointer}#app{height:100%;display:grid;grid-template-columns:230px 1fr;gap:24px;padding:26px 30px}
aside{display:flex;flex-direction:column;border-right:1px solid #26354d;padding:6px 18px 6px 0;min-height:0}.brand{font-size:22px;font-weight:900;letter-spacing:2px;margin:6px 0 42px}.brand span{color:var(--cyan)}.nav{display:grid;gap:10px}.nav button{padding:15px 16px;text-align:left;border-radius:13px;color:#aab7ca;font-size:17px}.nav button.active,.nav button:focus{background:linear-gradient(100deg,#17394a,#242044);border-color:#4b7892;color:white;outline:none;box-shadow:0 0 0 2px #56e4ff55}.sidefoot{margin-top:auto;color:#6e7d95;font-size:12px;line-height:1.6}
main{min-width:0;min-height:0;display:flex;flex-direction:column}.top{height:54px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.crumb{color:var(--muted);font-size:15px}.topright{display:flex;align-items:center;gap:16px;color:var(--muted)}.clock{font-size:18px;color:#dce9f7}.content{overflow:auto;min-height:0;padding:4px 8px 24px 0;scrollbar-width:none}.content::-webkit-scrollbar{display:none}
.hero{min-height:300px;border:1px solid #30435d;border-radius:24px;overflow:hidden;position:relative;padding:36px;display:flex;align-items:flex-end;background:linear-gradient(90deg,#0a1424 0%,#0c1725dd 44%,#10172a55 100%),radial-gradient(ellipse at 80% 35%,#714ca5 0,transparent 27%),radial-gradient(ellipse at 72% 70%,#146e85 0,transparent 36%),linear-gradient(135deg,#182943,#090d19);box-shadow:0 18px 60px #0008}.hero:after{content:"CINEMA";position:absolute;right:5%;top:8%;font-size:clamp(55px,10vw,150px);font-weight:900;letter-spacing:10px;color:#ffffff0b}.hero-copy{position:relative;z-index:1;max-width:620px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:bold;letter-spacing:3px;text-transform:uppercase}.hero h1{font-size:clamp(32px,4vw,54px);margin:12px 0}.hero p{color:#b9c7da;font-size:16px;line-height:1.5;max-width:540px}.actions{display:flex;gap:12px;margin-top:22px}.primary,.secondary{padding:13px 20px;border-radius:12px;font-weight:bold}.primary{background:linear-gradient(110deg,#35cde9,#8270ff);color:#06101b}.secondary{border-color:#52647e;background:#101a2b}
.section{margin-top:26px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section h2{font-size:21px;margin:0}.hint{font-size:12px;color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(5,minmax(115px,1fr));gap:14px}.tile{min-width:0;border:1px solid #26364d;border-radius:15px;background:linear-gradient(145deg,#18263b,#0e1523);padding:18px;min-height:115px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.tile:focus,.tile.selected{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px #56e4ff66,0 8px 30px #0006;transform:translateY(-2px)}.tile .ico{font-size:27px}.tile strong{font-size:15px}.tile small{color:var(--muted);margin-top:5px}.moviegrid{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:13px}.poster{height:150px;border-radius:12px;border:1px solid #354762;background:linear-gradient(145deg,var(--a),var(--b));display:flex;align-items:flex-end;padding:12px;font-size:14px;font-weight:bold;box-shadow:inset 0 -70px 45px -35px #000b}.poster:focus{outline:3px solid var(--cyan);outline-offset:2px}.empty{padding:24px;border:1px dashed #34445d;border-radius:14px;color:var(--muted)}
.searchbox{width:min(420px,50vw);padding:12px 15px;border:1px solid #40536f;background:#101827;border-radius:12px;outline:none}.searchbox:focus{border-color:var(--cyan)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#18283b;border:1px solid #56e4ff88;padding:12px 18px;border-radius:12px;display:none;z-index:9}
@media(max-width:850px){#app{grid-template-columns:170px 1fr;padding:18px;gap:14px}.tiles{grid-template-columns:repeat(3,1fr)}.moviegrid{grid-template-columns:repeat(4,1fr)}.hero{min-height:250px;padding:24px}}
@media(max-width:600px){#app{grid-template-columns:1fr;padding:14px}aside{border:0;padding:0;height:auto}.brand{margin:0 0 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.sidefoot{display:none}.top{height:40px}.tiles{grid-template-columns:repeat(2,1fr)}.moviegrid{grid-template-columns:repeat(3,1fr)}.hero{min-height:230px}}
</style>
</head>
<body>
<div id="app">
<aside><div class="brand">CINEMA <span>OS</span></div>
<nav class="nav" id="nav">
<button class="active" data-page="home">⌂　Главная</button><button data-page="catalog">▦　Каталог</button><button data-page="search">⌕　Поиск</button><button data-page="favorites">♡　Избранное</button><button data-page="sources">◈　Источники</button><button data-page="settings">⚙　Настройки</button>
</nav><div class="sidefoot">CYBER EDITION<br>MSX PLAYER · LG webOS<br><span id="version">Cinema OS 0.1.0</span></div></aside>
<main><header class="top"><div class="crumb" id="crumb">ВАШ КИНОЦЕНТР / ГЛАВНАЯ</div><div class="topright"><span id="status">● SYSTEM READY</span><span class="clock" id="clock">--:--</span></div></header>
<div class="content" id="content"></div></main></div><div id="toast"></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), content=$('#content');
const demo=[['Дюна: Часть вторая','#a17a50','#17253b'],['Интерстеллар','#315d79','#101528'],['Бегущий по лезвию 2049','#a75c3c','#17213b'],['Начало','#596b8a','#16192c'],['Матрица','#287a68','#0a1824'],['Грань будущего','#6b566e','#17223b']];
let page='home',focusIndex=0;
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function toast(t){let el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.style.display='none',2200)}
function movieCards(items){return '<div class="moviegrid">'+items.map((m,i)=>'<button class="poster" data-movie="'+i+'" style="--a:'+m[1]+';--b:'+m[2]+'">'+m[0]+'</button>').join('')+'</div>'}
function home(){return '<section class="hero"><div class="hero-copy"><div class="eyebrow">YOUR PERSONAL MEDIA SPACE</div><h1>Твой мир кино<br>в одном месте</h1><p>Cinema OS объединяет любимые фильмы, быстрый доступ к источникам и удобную навигацию с пульта телевизора.</p><div class="actions"><button class="primary" data-go="catalog">Открыть каталог　›</button><button class="secondary" data-go="sources">Источники</button></div></div></section><section class="section"><div class="sectionhead"><h2>Быстрый доступ</h2><span class="hint">ВЫБЕРИТЕ РАЗДЕЛ</span></div><div class="tiles"><button class="tile" data-go="catalog"><span class="ico">▦</span><strong>Каталог</strong><small>Подборки и фильмы</small></button><button class="tile" data-go="search"><span class="ico">⌕</span><strong>Поиск</strong><small>Найти фильм</small></button><button class="tile" data-go="favorites"><span class="ico">♡</span><strong>Избранное</strong><small>Ваша коллекция</small></button><button class="tile" data-go="sources"><span class="ico">◈</span><strong>Источники</strong><small>Сервисы просмотра</small></button><button class="tile" data-go="settings"><span class="ico">⚙</span><strong>Настройки</strong><small>Настроить Cinema OS</small></button></div></section><section class="section"><div class="sectionhead"><h2>Популярное</h2><span class="hint">ДЕМО-КАРТОЧКИ</span></div>'+movieCards(demo)+'</section>'}
function catalog(){return '<section class="section"><div class="sectionhead"><h2>Каталог</h2><span class="hint">ПРИМЕР ИНТЕРФЕЙСА</span></div><p class="hint">Здесь будет подключён каталог фильмов. Пока доступны демонстрационные карточки.</p>'+movieCards(demo)+'</section>'}
function search(){return '<section class="section"><h2>Поиск</h2><p class="hint">Введите название фильма или сериала.</p><input class="searchbox" id="q" placeholder="Например, Интерстеллар"><div id="results" style="margin-top:20px">'+movieCards(demo)+'</div></section>'}
function favorites(){let fav=read('cos_favs',[]);let arr=demo.filter(x=>fav.includes(x[0]));return '<section class="section"><h2>Избранное</h2><p class="hint">Сохранённые карточки останутся на этом устройстве.</p>'+(arr.length?movieCards(arr):'<div class="empty">Пока пусто. Откройте каталог и добавьте фильм в избранное.</div>')+'</section>'}
function sources(){let src=read('cos_sources',[{name:'Lampa',url:'https://lampa.mx'},{name:'Media Station X',url:'https://msx.benzac.de' }]);return '<section class="section"><h2>Источники</h2><p class="hint">Добавляйте только сервисы и плагины, которыми вы вправе пользоваться.</p><div class="tiles">'+src.map((s,i)=>'<button class="tile" data-source="'+i+'"><span class="ico">◈</span><strong>'+esc(s.name)+'</strong><small>'+esc(s.url)+'</small></button>').join('')+'</div><div class="section"><h2>Добавить источник</h2><input class="searchbox" id="sname" placeholder="Название"><br><br><input class="searchbox" id="surl" placeholder="https://адрес-сервиса"><br><br><button class="primary" id="addsource">Добавить</button></div></section>'}
function settings(){return '<section class="section"><h2>Настройки</h2><div class="tiles"><button class="tile" id="reset"><span class="ico">↻</span><strong>Сбросить данные</strong><small>Очистить локальные настройки</small></button><div class="tile"><span class="ico">⌨</span><strong>Управление</strong><small>Стрелки — навигация · OK — выбор · Back — назад</small></div><div class="tile"><span class="ico">◉</span><strong>Режим</strong><small>Cyber / Hybrid</small></div></div></section>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(p){page=p;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent='ВАШ КИНОЦЕНТР / '+({home:'ГЛАВНАЯ',catalog:'КАТАЛОГ',search:'ПОИСК',favorites:'ИЗБРАННОЕ',sources:'ИСТОЧНИКИ',settings:'НАСТРОЙКИ'}[p]||p.toUpperCase());content.innerHTML=({home,catalog,search,favorites,sources,settings}[p]||home)();focusIndex=0;let first=content.querySelector('button,input');if(first)first.focus();bind()}
function bind(){content.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>render(b.dataset.go));content.querySelectorAll('[data-movie]').forEach(b=>b.onclick=()=>{let title=b.textContent;let fav=read('cos_favs',[]);if(fav.includes(title)){fav=fav.filter(x=>x!==title);toast('Удалено из избранного')}else{fav.push(title);toast('Добавлено в избранное')}write('cos_favs',fav)});let q=$('#q');if(q)q.oninput=()=>{let v=q.value.toLowerCase();let arr=demo.filter(m=>m[0].toLowerCase().includes(v));$('#results').innerHTML=arr.length?movieCards(arr):'<div class="empty">Ничего не найдено</div>';bind()};let add=$('#addsource');if(add)add.onclick=()=>{let name=$('#sname').value.trim(),url=$('#surl').value.trim();if(!name||!/^https?:\/\//i.test(url)){toast('Укажите название и корректный HTTPS/HTTP адрес');return}let list=read('cos_sources',[]);list.push({name,url});write('cos_sources',list);render('sources');toast('Источник добавлен')};content.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{let s=read('cos_sources',[])[+b.dataset.source];if(s&&confirm('Открыть '+s.name+'?'))location.href=s.url});let reset=$('#reset');if(reset)reset.onclick=()=>{if(confirm('Очистить избранное и настройки?')){localStorage.removeItem('cos_favs');localStorage.removeItem('cos_sources');render('settings');toast('Локальные данные очищены')}}}
$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.page));
function back(){if(page!=='home')render('home');else toast('Вы на главном экране')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'||e.key==='BrowserBack'){if(document.activeElement&&['INPUT'].includes(document.activeElement.tagName)){document.activeElement.blur();return}back();return}if(e.key==='Enter'&&document.activeElement&&document.activeElement.tagName==='BUTTON'){document.activeElement.click()}});
window.addEventListener('popstate',back);
function tick(){let d=new Date();$('#clock').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,15000);render('home');
})();
</script></body></html>
